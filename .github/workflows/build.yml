name: Build Android APK Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Set Up Flutter 3.22+
        uses: actions/setup-flutter@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: 4. Ekstrak ZIP Proyek Otomatis
        run: |
          if [ -f "mendek_arena_masteran_burung_flutter.zip" ]; then
            unzip -q mendek_arena_masteran_burung_flutter.zip
          fi

      - name: 5. Install Dependencies (pub get)
        run: |
          if [ -d "mendek_arena_masteran_burung_flutter" ]; then
            cd mendek_arena_masteran_burung_flutter
          elif [ -d "flutter_project" ]; then
            cd flutter_project
          fi
          flutter pub get

      - name: 6. Build Release APK
        run: |
          if [ -d "mendek_arena_masteran_burung_flutter" ]; then
            cd mendek_arena_masteran_burung_flutter
          elif [ -d "flutter_project" ]; then
            cd flutter_project
          fi
          flutter build apk --release

      - name: 7. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mendek-Arena-Masteran-Burung-APK
          path: |
            **/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
