name: Build Android APK Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Ekstrak ZIP Proyek
        run: |
          if [ -f "mendek_arena_masteran_burung_flutter.zip" ]; then
            unzip -q -o mendek_arena_masteran_burung_flutter.zip
          fi

      - name: 3. Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 5. Generate Android Harness & Patch
        run: |
          DIR="."
          if [ -d "mendek_arena_masteran_burung_flutter" ]; then
            DIR="mendek_arena_masteran_burung_flutter"
          fi
          cd "$DIR"

          # 1. Hapus folder android lama yang tidak memiliki gradle wrapper
          rm -rf android

          # 2. Generate android harness resmi Flutter 3.22
          flutter create --org com.mendekarena --project-name mendek_arena_masteran_burung --platforms=android .

          # 3. Patch build.gradle (desugaring & minSdk 21)
          python3 -c '
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              s = f.read()
          s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
          s = s.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
          if "desugar_jdk_libs" not in s:
              s = s.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
              s += "\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n"
          with open(path, "w") as f:
              f.write(s)
          '

          # 4. Patch AndroidManifest.xml (izin alarm, wake lock, boot receiver)
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              s = f.read()
          perms = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
          """
          receivers = """
                  <receiver
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      </intent-filter>
                  </receiver>
                  <receiver
                      android:name="com.dexterous.flutterlocalnotifications.ActionBroadcastReceiver"
                      android:exported="false" />
          """
          s = s.replace("<application", perms + "\n    <application")
          s = s.replace("<activity", "<activity\n            android:showWhenLocked=\"true\"\n            android:turnScreenOn=\"true\"\n            android:keepScreenOn=\"true\"")
          s = s.replace("</application>", receivers + "\n    </application>")
          with open(path, "w") as f:
              f.write(s)
          '

          flutter pub get

      - name: 6. Build Release APK
        run: |
          DIR="."
          if [ -d "mendek_arena_masteran_burung_flutter" ]; then
            DIR="mendek_arena_masteran_burung_flutter"
          fi
          cd "$DIR"
          flutter build apk --release --no-tree-shake-icons

      - name: 7. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mendek-Arena-Masteran-Burung-APK
          path: |
            **/build/app/outputs/flutter-apk/app-release.apk
            **/build/app/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
