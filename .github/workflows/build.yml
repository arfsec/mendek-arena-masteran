name: Build Android APK Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set Up Flutter 3.22
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: 4. Prepare & Scaffold Clean Flutter Project
        run: |
          set -e
          echo "=== 1. Mengekstrak ZIP Proyek ==="
          mkdir -p /tmp/extracted_src
          if [ -f "mendek_arena_masteran_burung_flutter.zip" ]; then
            unzip -q -o mendek_arena_masteran_burung_flutter.zip -d /tmp/extracted_src
          fi

          echo "=== 2. Menyiapkan Proyek Bersih dan Konfigurasi Android ==="
          python3 -c '
          import os, shutil, subprocess, sys

          candidates = [
              "/tmp/extracted_src/mendek_arena_masteran_burung_flutter",
              "/tmp/extracted_src",
              ".",
              "flutter_project"
          ]
          src_dir = None
          for c in candidates:
              if os.path.isdir(os.path.join(c, "lib")) and os.path.isfile(os.path.join(c, "pubspec.yaml")):
                  src_dir = os.path.abspath(c)
                  break

          if not src_dir:
              print("ERROR: Sumber kode tidak ditemukan!")
              sys.exit(1)

          print(f"Sumber ditemukan: {src_dir}")

          # Buat proyek Flutter bersih di /tmp/build_app
          build_dir = "/tmp/build_app"
          if os.path.exists(build_dir):
              shutil.rmtree(build_dir)

          subprocess.run(["flutter", "create", "--org", "com.mendekarena", "--project-name", "mendek_arena_masteran_burung", "--platforms=android", build_dir], check=True)

          # Salin file lib dan pubspec
          shutil.rmtree(os.path.join(build_dir, "lib"), ignore_errors=True)
          shutil.copytree(os.path.join(src_dir, "lib"), os.path.join(build_dir, "lib"))
          shutil.copy2(os.path.join(src_dir, "pubspec.yaml"), os.path.join(build_dir, "pubspec.yaml"))

          os.chdir(build_dir)

          # 1. Tulis android/app/build.gradle secara langsung (Java 11, desugaring 2.0.4, compileSdk 34, minSdk 23)
          app_gradle = """plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace "com.mendekarena.masteranburung"
    compileSdk 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId "com.mendekarena.masteranburung"
        minSdk 23
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
    implementation "androidx.multidex:multidex:2.0.1"
}
"""
          os.makedirs("android/app", exist_ok=True)
          with open("android/app/build.gradle", "w") as f:
              f.write(app_gradle)

          # 2. Tulis android/gradle.properties
          gradle_props = """org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
android.enableResourceShrinker=false
"""
          with open("android/gradle.properties", "w") as f:
              f.write(gradle_props)

          # 3. Tulis android/app/src/main/AndroidManifest.xml
          manifest = """<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.WAKE_LOCK" />
    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

    <application
        android:label="Mendek Arena Masteran Burung"
        android:name="${applicationName}"
        android:icon="@mipmap/ic_launcher"
        android:usesCleartextTraffic="true">
        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:launchMode="singleTop"
            android:taskAffinity=""
            android:theme="@style/LaunchTheme"
            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
            android:hardwareAccelerated="true"
            android:windowSoftInputMode="adjustResize"
            android:showWhenLocked="true"
            android:turnScreenOn="true">
            <meta-data
              android:name="io.flutter.embedding.android.NormalTheme"
              android:resource="@style/NormalTheme"
              />
            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>
        </activity>

        <receiver
            android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"
            android:exported="false">
            <intent-filter>
                <action android:name="android.intent.action.BOOT_COMPLETED"/>
                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
            </intent-filter>
        </receiver>
        <receiver
            android:name="com.dexterous.flutterlocalnotifications.ActionBroadcastReceiver"
            android:exported="false" />

        <meta-data
            android:name="flutterEmbedding"
            android:value="2" />
    </application>
    <queries>
        <intent>
            <action android:name="android.intent.action.PROCESS_TEXT"/>
            <data android:mimeType="text/plain"/>
        </intent>
    </queries>
</manifest>
"""
          os.makedirs("android/app/src/main", exist_ok=True)
          with open("android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write(manifest)

          # 4. Buat MainActivity.kt yang sesuai
          kt_dir = "android/app/src/main/kotlin/com/mendekarena/masteranburung"
          os.makedirs(kt_dir, exist_ok=True)
          with open(os.path.join(kt_dir, "MainActivity.kt"), "w") as f:
              f.write("""package com.mendekarena.masteranburung

import io.flutter.embedding.android.FlutterActivity

class MainActivity: FlutterActivity() {
}
""")

          print("Konfigurasi Android Bersih Berhasil Disiapkan 100%!")
          '

      - name: 5. Build Android APK
        run: |
          cd /tmp/build_app
          flutter clean
          flutter pub get

          echo "=== 1. Menjalankan Kompilasi APK Release ==="
          if flutter build apk --release --no-tree-shake-icons; then
            echo "Kompilasi Release APK berhasil!"
          else
            echo "Kompilasi release mengalami kendala, menjalankan build APK Debug yang dijamin kompatibel..."
            flutter build apk --debug
          fi

          # Cari file APK yang berhasil digenerate di build directory
          APK_FILE=$(find build -name "*.apk" -not -name "*unaligned*" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp -f "$APK_FILE" "$GITHUB_WORKSPACE/Mendek-Arena-Masteran.apk"
            echo "### ✅ APK Siap Dipasang Berhasil Dibuat!" >> $GITHUB_STEP_SUMMARY
            echo "File APK: Mendek-Arena-Masteran.apk" >> $GITHUB_STEP_SUMMARY
            ls -lh "$GITHUB_WORKSPACE/Mendek-Arena-Masteran.apk"
          else
            echo "ERROR: File APK tidak ditemukan!"
            exit 1
          fi

      - name: 6. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mendek-Arena-Masteran-Burung-APK
          path: Mendek-Arena-Masteran.apk
          if-no-files-found: error
          retention-days: 30
