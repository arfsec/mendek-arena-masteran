name: Build Android APK Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Ekstrak ZIP Proyek
        run: |
          if [ -f "mendek_arena_masteran_burung_flutter.zip" ]; then
            unzip -q -o mendek_arena_masteran_burung_flutter.zip
          fi

      - name: 3. Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 5. Install Dependencies (pub get)
        run: |
          if [ -d "mendek_arena_masteran_burung_flutter" ]; then
            cd mendek_arena_masteran_burung_flutter
          elif [ -d "flutter_project" ]; then
            cd flutter_project
          fi
          flutter pub get

      - name: 6. Build Release APK
        run: |
          if [ -d "mendek_arena_masteran_burung_flutter" ]; then
            cd mendek_arena_masteran_burung_flutter
          elif [ -d "flutter_project" ]; then
            cd flutter_project
          fi
          flutter build apk --release

      - name: 7. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mendek-Arena-Masteran-Burung-APK
          path: |
            **/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
