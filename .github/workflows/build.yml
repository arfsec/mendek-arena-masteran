name: Build Android APK Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set Up Flutter 3.22
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: 4. Prepare & Scaffold Clean Flutter Project
        run: |
          set -e
          echo "=== 1. Mengekstrak ZIP Proyek ==="
          mkdir -p /tmp/extracted_src
          if [ -f "mendek_arena_masteran_burung_flutter.zip" ]; then
            unzip -q -o mendek_arena_masteran_burung_flutter.zip -d /tmp/extracted_src
          fi

          echo "=== 2. Menyiapkan Proyek Bersih dan Dependensi ==="
          python3 -c '
          import os, shutil, subprocess, sys

          candidates = [
              "/tmp/extracted_src/mendek_arena_masteran_burung_flutter",
              "/tmp/extracted_src",
              ".",
              "flutter_project"
          ]
          src_dir = None
          for c in candidates:
              if os.path.isdir(os.path.join(c, "lib")) and os.path.isfile(os.path.join(c, "pubspec.yaml")):
                  src_dir = os.path.abspath(c)
                  break

          if not src_dir:
              print("ERROR: Sumber kode tidak ditemukan!")
              sys.exit(1)

          print(f"Sumber ditemukan: {src_dir}")

          # Buat proyek Flutter bersih di /tmp/build_app
          build_dir = "/tmp/build_app"
          if os.path.exists(build_dir):
              shutil.rmtree(build_dir)

          subprocess.run(["flutter", "create", "--org", "com.mendekarena", "--project-name", "mendek_arena_masteran_burung", "--platforms=android", build_dir], check=True)

          # Salin file lib dan pubspec
          shutil.rmtree(os.path.join(build_dir, "lib"), ignore_errors=True)
          shutil.copytree(os.path.join(src_dir, "lib"), os.path.join(build_dir, "lib"))
          shutil.copy2(os.path.join(src_dir, "pubspec.yaml"), os.path.join(build_dir, "pubspec.yaml"))

          # Patch gradle (Java 11, desugaring 2.1.4, minSdk 21, multiDex, debug signing for release)
          os.chdir(build_dir)
          for gfile in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.isfile(gfile):
                  with open(gfile, "r") as f:
                      g = f.read()
                  g = g.replace("minSdk = flutter.minSdkVersion", "minSdk = 21\n        multiDexEnabled = true")
                  g = g.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21\n        multiDexEnabled true")
                  g = g.replace("sourceCompatibility = JavaVersion.VERSION_1_8", "sourceCompatibility = JavaVersion.VERSION_11\n        coreLibraryDesugaringEnabled true")
                  g = g.replace("sourceCompatibility JavaVersion.VERSION_1_8", "sourceCompatibility JavaVersion.VERSION_11\n        coreLibraryDesugaringEnabled true")
                  g = g.replace("targetCompatibility = JavaVersion.VERSION_1_8", "targetCompatibility = JavaVersion.VERSION_11")
                  g = g.replace("targetCompatibility JavaVersion.VERSION_1_8", "targetCompatibility JavaVersion.VERSION_11")
                  g = g.replace("jvmTarget = 1.8", "jvmTarget = \"11\"")
                  g = g.replace("jvmTarget = JavaVersion.VERSION_1_8", "jvmTarget = \"11\"")
                  
                  if "coreLibraryDesugaringEnabled" not in g:
                      g = g.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true\n        sourceCompatibility JavaVersion.VERSION_11\n        targetCompatibility JavaVersion.VERSION_11")
                  
                  if "signingConfig = signingConfigs.debug" not in g and "signingConfig signingConfigs.debug" not in g:
                      g = g.replace("buildTypes {", "buildTypes {\n        release {\n            signingConfig = signingConfigs.debug\n        }")
                  
                  if "desugar_jdk_libs" not in g:
                      g += "\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.1.4\"\n}\n"
                  
                  with open(gfile, "w") as f:
                      f.write(g)

          # Patch manifest (izin alarm, wake lock, dan receiver)
          mfile = "android/app/src/main/AndroidManifest.xml"
          if os.path.isfile(mfile):
              with open(mfile, "r") as f:
                  m = f.read()
              perms = """
                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.WAKE_LOCK" />
                  <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
                  <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
                  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
                  <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
                  <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
                  <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              """
              receivers = """
                      <receiver
                          android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"
                          android:exported="false">
                          <intent-filter>
                              <action android:name="android.intent.action.BOOT_COMPLETED"/>
                              <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          </intent-filter>
                      </receiver>
                      <receiver
                          android:name="com.dexterous.flutterlocalnotifications.ActionBroadcastReceiver"
                          android:exported="false" />
              """
              if "SCHEDULE_EXACT_ALARM" not in m:
                  m = m.replace("<application", perms + "\n    <application")
              if "ScheduledNotificationBootReceiver" not in m:
                  m = m.replace("</application>", receivers + "\n    </application>")
              m = m.replace("<activity", "<activity\n            android:showWhenLocked=\"true\"\n            android:turnScreenOn=\"true\"")
              with open(mfile, "w") as f:
                  f.write(m)

          print("Setup berhasil 100%!")
          '

      - name: 5. Build Release APK
        run: |
          set -e
          cd /tmp/build_app
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons --verbose

          # Cari file APK yang dihasilkan
          APK_FILE=$(find build/app/outputs -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp -f "$APK_FILE" "$GITHUB_WORKSPACE/app-release.apk"
            echo "File APK berhasil ditemukan dan disalin dari: $APK_FILE"
            ls -lh "$GITHUB_WORKSPACE/app-release.apk"
          else
            echo "ERROR: File APK tidak ditemukan!"
            find build || true
            exit 1
          fi

      - name: 6. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mendek-Arena-Masteran-Burung-APK
          path: app-release.apk
          if-no-files-found: error
          retention-days: 30
